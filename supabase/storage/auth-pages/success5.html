<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录成功</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .container { text-align: center; padding: 40px 60px; background: rgba(255, 255, 255, 0.25); border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
        .icon { font-size: 72px; margin-bottom: 24px; }
        h1 { font-size: 28px; margin-bottom: 12px; }
        p { font-size: 16px; opacity: 0.9; }
        .countdown { margin-top: 20px; font-size: 14px; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✅</div>
        <h1>登录成功！</h1>
        <p>您可以关闭此窗口并返回应用</p>
        <p class="countdown" id="countdown">3 秒后自动关闭...</p>
    </div>
    <script>
        let seconds = 3;
        const countdownEl = document.getElementById('countdown');
        const timer = setInterval(() => {
            seconds--;
            if (seconds > 0) { countdownEl.textContent = seconds + ' 秒后自动关闭...'; } 
            else { clearInterval(timer); countdownEl.textContent = '正在关闭...'; window.close(); }
        }, 1000);
    </script>
</body>
</html>
